name: Update pantry prices
on:
  workflow_dispatch:
  schedule:
    - cron: '20 19 * * *' # 06:20 AEDT / 05:20 AEST
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect prices
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python collect.py
      - name: Commit updated feed
        run: |
          git config user.name "Pantry Hunter bot"
          git config user.email "pantry-hunter-bot@users.noreply.github.com"
          git add latest.json history.json
          git diff --cached --quiet || (git commit -m "Update supermarket prices" && git push)
